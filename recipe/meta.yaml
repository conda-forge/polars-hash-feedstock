{% set name = "polars-hash" %}
{% set version = "0.9.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/polars_hash-{{ version }}.tar.gz
    sha256: 91b935bd259125f2b2ddfc505d4e0cf4c9aaece84eddb3123ffa7ecf9aae17f1
  - url: https://raw.githubusercontent.com/ion-elgreco/polars-hash/main/LICENSE
    sha256: 017feb4ae87126410f1d9beb6af4c9df3c25a0051d87db66da6f26c509f5348d

build:
  number: 1
  # polars-hash builds a stable-ABI (abi3) extension targeting Python 3.10+
  # (see `pyo3 = { features = ["abi3-py310"] }` in Cargo.toml), so a single build
  # is compatible with every supported Python. Build only against python_min.
  python_version_independent: true   # [is_abi3]
  skip: True                         # [is_abi3 and not is_python_min]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - python  # [build_platform != target_platform]
    - maturin >=1.0,<2.0  # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - cargo-bundle-licenses
    - make
  host:
    - python-abi3                    # [is_abi3]
    - python
    - maturin >=1.0,<2.0
    - pip
  run:
    - python
    - polars >=1.36.1

test:
  imports:
    - polars_hash
  commands:
    - pip check
    - abi3audit $SP_DIR/polars_hash/_internal.abi3.so -s -v --assume-minimum-abi3 {{ python_min }}   # [unix and is_abi3]
    - abi3audit %SP_DIR%\polars_hash\_internal.pyd -s -v --assume-minimum-abi3 {{ python_min }}       # [win and is_abi3]
  requires:
    - pip
    - abi3audit                      # [is_abi3]

about:
  home: https://github.com/ion-elgreco/polars-hash
  summary: Stable non-cryptographic and cryptographic hashing functions for Polars
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - moritzwilksch
    - borchero
